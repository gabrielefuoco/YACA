name: 🚀 Build & Deploy Anime Source to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'services/anime-source/**'
      - '.github/workflows/deploy-anime-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR richiede nomi immagine minuscoli
          images: ghcr.io/${{ github.repository_owner }}/yaca-anime-source
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: 📦 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/anime-source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🌐 Rendi pubblico il package GHCR
        # Il package nasce privato e il server di casa lo scarica senza credenziali:
        # va reso pubblico una volta (come `yaca`). Questo step lo fa da sé quando
        # GitHub lo consente; se il token non ha i permessi necessari, avvisa e la
        # build resta valida — in quel caso la visibilità si imposta a mano.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "user/packages/container/yaca-anime-source" -f visibility=public \
            || gh api --method PATCH "repos/${{ github.repository }}/packages/container/yaca-anime-source" -f visibility=public \
            || echo "::warning title=Visibilità package::Impostare a mano: Packages → yaca-anime-source → Package settings → Change visibility → Public"
