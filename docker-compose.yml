services:
  redis:
    image: redis:7-alpine
    container_name: yaca-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/gabrielefuoco/yaca:${YACA_TAG:-latest}
    container_name: yaca-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:7860:7860"
    env_file:
      - .env
    environment:
      # Contratto di deploy: la porta e l'URL di Redis li decide il compose, non il .env locale.
      - PORT=7860
      - REDIS_URL=redis://redis:6379
    volumes:
      - yaca_tmdb:/data/tmdb
      - yaca_badges:/data/badges
    mem_limit: 1536m
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7860/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    # Fork mantenuto: `containrrr/watchtower` non è più aggiornato e il suo client parla
    # l'API Docker 1.25, mentre Engine 29 richiede >= 1.40 → crash-loop.
    # Drop-in: stesse label (com.centurylinklabs.watchtower.enable) e variabili WATCHTOWER_*.
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: yaca-watchtower
    restart: unless-stopped
    mem_limit: 50m
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Package GHCR privato: scommenta DOPO aver fatto `docker login ghcr.io` sull'host
      # (il file deve esistere, altrimenti Docker crea una directory al suo posto)
      # - /root/.docker/config.json:/config.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yaca_tmdb:
    name: yaca_tmdb
  yaca_badges:
    name: yaca_badges
