services:
  redis:
    image: redis:7-alpine
    container_name: yaca-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/gabrielefuoco/yaca:${YACA_TAG:-latest}
    container_name: yaca-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:7860:7860"
    env_file:
      - .env
    environment:
      # Contratto di deploy: la porta e l'URL di Redis li decide il compose, non il .env locale.
      - PORT=7860
      - REDIS_URL=redis://redis:6379
      # L'artefatto del servizio anime (indice di mapping, ~10 MB): il modulo `src/anime/`
      # lo legge da qui. Senza questo mount l'app non lo vede e i cataloghi anime degradano
      # in silenzio (verificato sul mate il 18/10/2026, ticket 30).
      - ANIME_MAPPING_PATH=/data/anime-source/anime-mappings.json
    volumes:
      - yaca_tmdb:/data/tmdb
      - yaca_badges:/data/badges
      # Poster già composti, prodotti fuori e copiati qui: serviti da /erdb-poster/<file>
      - yaca_erdb_cache:/data/erdb-cache
      # L'artefatto del servizio anime, in SOLA LETTURA: lo produce `anime-source`, lo legge l'app.
      - yaca_anime_source_cache:/data/anime-source:ro
      # Export statico di Next (ticket 56): volume bind-mount popolato da ops/frontend-aggiorna.sh
      - ./frontend-out:/app/frontend/out:ro
    mem_limit: 1536m
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7860/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  graph:
    build:
      # Il contesto è la cartella del servizio, non la radice: così il .dockerignore di root
      # (che esclude services/) non entra in gioco, e l'immagine si costruisce anche sul mate
      # con un semplice `docker compose build graph`.
      context: services/graph
      dockerfile: Dockerfile
    image: ghcr.io/gabrielefuoco/yaca-graph:${GRAPH_TAG:-latest}
    container_name: yaca-graph
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - PORT=7862
    volumes:
      # L'artefatto letto dal modulo come bind mount read-only dal disco del mate (decisione ticket 07 / 18)
      - /srv/yaca/services/graph/data:/app/services/graph/data:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7862/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  anime-source:
    image: ghcr.io/gabrielefuoco/yaca-anime-source:${ANIME_SOURCE_TAG:-latest}
    container_name: yaca-anime-source
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env
    volumes:
      # Cache persistente per i dump di mapping (Anibridge/Fribb) e catalogo serie in corso
      - yaca_anime_source_cache:/app/.cache
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Healthcheck basato sul battito di freschezza (.cache/last-run.json).
    # 'unhealthy' significa che nessun giro e' andato a buon fine nelle ultime 12 ore.
    # Docker NON riavvia autonomamente un container unhealthy; segnala lo stato per l'operatore.
    healthcheck:
      test: ["CMD", "node", "cli.js", "--health-check"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 5m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tmdb-daemon:
    image: ghcr.io/gabrielefuoco/yaca:${YACA_TAG:-latest}
    container_name: yaca-tmdb-daemon
    restart: unless-stopped
    command: ["node", "services/tmdb-daemon/cli.js"]
    mem_limit: 1024m
    env_file:
      - .env
    volumes:
      - yaca_tmdb:/data/tmdb
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "node", "services/tmdb-daemon/cli.js", "--health-check"]
      interval: 10m
      timeout: 10s
      retries: 2
      start_period: 2m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    # Fork mantenuto: `containrrr/watchtower` non è più aggiornato e il suo client parla
    # l'API Docker 1.25, mentre Engine 29 richiede >= 1.40 → crash-loop.
    # Drop-in: stesse label (com.centurylinklabs.watchtower.enable) e variabili WATCHTOWER_*.
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: yaca-watchtower
    restart: unless-stopped
    mem_limit: 50m
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Package GHCR privato: scommenta DOPO aver fatto `docker login ghcr.io` sull'host
      # (il file deve esistere, altrimenti Docker crea una directory al suo posto)
      # - /root/.docker/config.json:/config.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yaca_tmdb:
    name: yaca_tmdb
  yaca_badges:
    name: yaca_badges
  yaca_erdb_cache:
    name: yaca_erdb_cache
  yaca_anime_source_cache:
    name: yaca_anime_source_cache
